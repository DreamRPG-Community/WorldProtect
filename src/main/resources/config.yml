# Directory below the WorldProtect data folder containing one file per loaded world.
world-config-directory: worlds

edit-mode:
  permission: worldprotect.edit

# These values are copied into a world file the first time that world loads.
# Existing world files keep their own values when this template changes.
world-defaults:
  # Each value below blocks the named action when it is true.
  rules:
    block-placement: true
    block-breaking: true
    bucket-actions: true
    leaf-decay: true
    block-fade: true
    block-ignition: true
    fire-spread: true
    explosion-block-damage: true
    player-fall-damage: true
    ender-pearl-launch: false

  # disabled allows every block interaction. blacklist blocks listed IDs.
  # whitelist allows only listed IDs.
  interact:
    mode: disabled
    block-ids:
      - 0
      - 54
      - 58
      - 61
      - 62
      - 63
      - 68
      - 116
      - 117
      - 118
      - 130
      - 146
      - 323
      - 397
      - 330
      - 70
      - 148
      - 72
      - 147
      - 33
      - 23
      - 77
  # disabled allows every command. blacklist blocks listed names.
  # whitelist allows only listed names.
  commands:
    mode: blacklist
    names:
      - ?
      - bukkit:?
      - help
      - bukkit:help
      - pl
      - plugins
      - bukkit:pl
      - bukkit:plugins
